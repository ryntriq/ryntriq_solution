<rect x="80" y="764" width="1340" height="205" rx="20" fill="#FFFFFF"/>
<text x="112" y="810" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#718096">SUGGESTED USE</text>
<rect x="112" y="840" width="28" height="28" rx="7" fill="#258EFF"/><text x="154" y="861" font-family="Arial,sans-serif" font-size="17" fill="#14243A">Electric blue for the main mark, links and primary actions.</text>
<rect x="112" y="884" width="28" height="28" rx="7" fill="#55DDF9"/><text x="154" y="905" font-family="Arial,sans-serif" font-size="17" fill="#14243A">Cyan for highlights, signal points and small accents.</text>
<rect x="760" y="840" width="28" height="28" rx="7" fill="#14243A"/><text x="802" y="861" font-family="Arial,sans-serif" font-size="17" fill="#14243A">Navy for text and light-background layouts.</text>
<rect x="760" y="884" width="28" height="28" rx="7" fill="#091322"/><text x="802" y="905" font-family="Arial,sans-serif" font-size="17" fill="#14243A">Night base for banners, product screens and dark layouts.</text>
