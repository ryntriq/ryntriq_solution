<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="t d">
<title id="t">RYNTRIQ Fusion color palette</title><desc id="d">Color palette extracted from the selected Fusion logo with HEX values and usage roles.</desc>
<rect width="1500" height="1050" fill="#F2F5F8"/>
<text x="80" y="77" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#708095">RYNTRIQ  /  FUSION BRAND COLORS</text>
<text x="80" y="135" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#14243A">Color system</text>
<text x="80" y="174" font-family="Arial,sans-serif" font-size="17" fill="#63748A">The selected Fusion logo’s blue signal, cool steel and deep navy.</text>
<text x="80" y="238" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#718096">BRAND COLORS</text>
<g font-family="Arial,sans-serif">
 <rect x="80" y="260" width="315" height="190" rx="18" fill="#55DDF9"/><text x="106" y="379" font-size="19" font-weight="700" fill="#0B2840">Signal Cyan</text><text x="106" y="415" font-size="17" fill="#0B2840">#55DDF9</text>
