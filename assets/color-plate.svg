 <rect x="750" y="260" width="315" height="190" rx="18" fill="#4772E8"/><text x="776" y="379" font-size="19" font-weight="700" fill="#FFFFFF">Deep Blue</text><text x="776" y="415" font-size="17" fill="#FFFFFF">#4772E8</text>
 <rect x="1085" y="260" width="335" height="190" rx="18" fill="#90A5BC"/><text x="1111" y="379" font-size="19" font-weight="700" fill="#102039">Cool Steel</text><text x="1111" y="415" font-size="17" fill="#102039">#90A5BC</text>
</g>
<text x="80" y="515" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#718096">FOUNDATION & BACKGROUNDS</text>
<g font-family="Arial,sans-serif">
 <rect x="80" y="537" width="315" height="170" rx="18" fill="#14243A"/><text x="106" y="636" font-size="19" font-weight="700" fill="#FFFFFF">Wordmark Navy</text><text x="106" y="672" font-size="17" fill="#D3E0EF">#14243A</text>
 <rect x="415" y="537" width="315" height="170" rx="18" fill="#091322"/><text x="441" y="636" font-size="19" font-weight="700" fill="#FFFFFF">Night Base</text><text x="441" y="672" font-size="17" fill="#D3E0EF">#091322</text>
 <rect x="750" y="537" width="315" height="170" rx="18" fill="#111D32"/><text x="776" y="636" font-size="19" font-weight="700" fill="#FFFFFF">Banner Navy</text><text x="776" y="672" font-size="17" fill="#D3E0EF">#111D32</text>
 <rect x="1085" y="537" width="335" height="170" rx="18" fill="#F5F8FC" stroke="#DCE4EC" stroke-width="2"/><text x="1111" y="636" font-size="19" font-weight="700" fill="#14243A">Cloud White</text><text x="1111" y="672" font-size="17" fill="#53657C">#F5F8FC</text>
